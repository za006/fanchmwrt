name: Build FanchmWrt kmod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses5-dev \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-dev \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            swig \
            time \
            xsltproc \
            libxml-parser-perl \
            libelf-dev \
            device-tree-compiler

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Create configuration
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y

          CONFIG_PACKAGE_kmod-ip6tables=m
          CONFIG_PACKAGE_kmod-nf-ipt6=m
          CONFIG_PACKAGE_ip6tables-nft=m
          EOF

          make defconfig

      - name: Clean incomplete host tools
        run: |
          rm -rf staging_dir/host
          rm -rf build_dir/host
          rm -rf tmp

      - name: Build OpenWrt host tools
        run: |
          make tools/install -j2 V=s

      - name: Build OpenWrt toolchain
        run: |
          make toolchain/install -j2 V=s

      - name: Check required host tools
        run: |
          test -x staging_dir/host/bin/openssl
          test -x staging_dir/host/bin/libdeflate-gzip

          echo "openssl:"
          ls -l staging_dir/host/bin/openssl

          echo "libdeflate-gzip:"
          ls -l staging_dir/host/bin/libdeflate-gzip

      - name: Build kernel modules and ip6tables
        run: |
          make -j2 \
            package/kernel/linux/compile \
            package/network/utils/iptables/compile \
            V=s

      - name: Collect packages
        run: |
          mkdir -p result

          find bin -type f \
            \( \
              -name '*kmod-ip6tables*.ipk' \
              -o -name '*kmod-nf-ipt6*.ipk' \
              -o -name '*ip6tables-nft*.ipk' \
            \) \
            -exec cp -v {} result/ \;

          echo "Generated files:"
          ls -lh result

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: fanchmwrt-ip6tables-kmods
          path: result/
          if-no-files-found: error
