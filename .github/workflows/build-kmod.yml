name: Build FanchmWrt kmod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses5-dev libssl-dev python3 \
            python3-setuptools rsync unzip zlib1g-dev file wget curl \
            swig time

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Create configuration
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_PACKAGE_kmod-ip6tables=m
          CONFIG_PACKAGE_kmod-nf-ipt6=m
          CONFIG_PACKAGE_ip6tables-nft=m
          EOF

          make defconfig

      - name: Build packages
        run: |
          make -j2 \
            package/kernel/linux/compile \
            package/network/utils/iptables/compile \
            V=s

      - name: Collect packages
        run: |
          mkdir -p result
          find bin -type f \
            \( -name '*kmod-ip6tables*' \
            -o -name '*kmod-nf-ipt6*' \
            -o -name '*ip6tables-nft*' \) \
            -exec cp -v {} result/ \;

          echo "Generated files:"
          ls -lh result

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: fanchmwrt-ip6tables-kmods
          path: result/
