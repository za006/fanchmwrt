name: Build FanchmWrt kmod

on:
  workflow_dispatch:
    inputs:
      make_jobs:
        description: "Parallel make jobs"
        required: false
        default: "2"

      strict_packages:
        description: "Fail when required packages are missing"
        required: false
        default: "false"

permissions:
  contents: read

env:
  TARGET: mediatek
  SUBTARGET: filogic

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      MAKE_JOBS: ${{ github.event.inputs.make_jobs || '2' }}
      STRICT_PACKAGES: ${{ github.event.inputs.strict_packages || 'false' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-dev \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            swig \
            time \
            xsltproc \
            libxml-parser-perl \
            libelf-dev \
            device-tree-compiler \
            libreadline-dev \
            autoconf \
            automake \
            pkg-config \
            ca-certificates \
            xz-utils

      - name: Update feeds
        shell: bash
        run: |
          set -euo pipefail

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Create OpenWrt configuration
        shell: bash
        run: |
          set -euo pipefail

          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y

          CONFIG_PACKAGE_kmod-ip6tables=m
          CONFIG_PACKAGE_kmod-nf-ipt6=m
          CONFIG_PACKAGE_ip6tables-nft=m
          EOF

          make defconfig

          echo "=== Final target configuration ==="
          grep -E '^CONFIG_TARGET_' .config || true

          echo "=== Final package configuration ==="
          grep -E \
            '^CONFIG_PACKAGE_(kmod-ip6tables|kmod-nf-ipt6|ip6tables-nft)=' \
            .config || true

      - name: Validate build parameters
        shell: bash
        run: |
          set -euo pipefail

          if ! [[ "${MAKE_JOBS}" =~ ^[1-9][0-9]*$ ]]; then
            echo "ERROR: make_jobs must be a positive integer"
            exit 1
          fi

          case "${STRICT_PACKAGES}" in
            true|false)
              ;;
            *)
              echo "ERROR: strict_packages must be true or false"
              exit 1
              ;;
          esac

          echo "MAKE_JOBS=${MAKE_JOBS}"
          echo "STRICT_PACKAGES=${STRICT_PACKAGES}"

      - name: Clean stale build output
        shell: bash
        run: |
          set -euo pipefail

          echo "Cleaning stale host and package output..."

          rm -rf staging_dir/host
          rm -rf build_dir/host
          rm -rf build_dir/hostpkg
          rm -rf tmp

          rm -rf bin/packages
          rm -rf "bin/targets/${TARGET}/${SUBTARGET}/packages"

          echo "Stale output cleanup completed"

      - name: Download sources
        shell: bash
        run: |
          set -euo pipefail

          make download \
            -j"${MAKE_JOBS}" \
            V=sc 2>&1 | tee download.log

      - name: Build host tools and toolchain
        shell: bash
        run: |
          set -euo pipefail

          make tools/install \
            -j"${MAKE_JOBS}" \
            V=sc 2>&1 | tee tools-build.log

          make toolchain/install \
            -j"${MAKE_JOBS}" \
            V=sc 2>&1 | tee toolchain-build.log

      - name: Prepare Linux kernel tree
        shell: bash
        run: |
          set -euo pipefail

          make target/linux/prepare \
            -j"${MAKE_JOBS}" \
            V=sc 2>&1 | tee linux-prepare.log

      - name: Build Linux kernel
        shell: bash
        run: |
          set -euo pipefail

          make target/linux/compile \
            -j"${MAKE_JOBS}" \
            V=sc 2>&1 | tee linux-compile.log

      - name: Inspect generated kernel configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for generated kernel .config..."

          KERNEL_CONFIG="$(
            find build_dir \
              -type f \
              -path '*/linux-*/.config' \
              -print \
              2>/dev/null \
              | head -n 1
          )"

          if [ -z "${KERNEL_CONFIG}" ]; then
            echo "::warning::Kernel .config was not found"
            echo "Possible kernel directories:"
            find build_dir \
              -type d \
              -name 'linux-*' \
              -print \
              2>/dev/null \
              | head -n 50 || true
            exit 0
          fi

          echo "Kernel .config found:"
          echo "${KERNEL_CONFIG}"

          echo "=== Relevant kernel options ==="
          grep -E \
            '^(CONFIG_MODULES|CONFIG_NETFILTER|CONFIG_NETFILTER_ADVANCED|CONFIG_NF_TABLES|CONFIG_NF_CONNTRACK|CONFIG_IP6_NF|CONFIG_NF_IPTABLES)' \
            "${KERNEL_CONFIG}" \
            || true

          if grep -qxF 'CONFIG_MODULES=y' "${KERNEL_CONFIG}"; then
            echo "OK: CONFIG_MODULES=y"
          else
            echo "::warning::CONFIG_MODULES=y was not found"
          fi

          for option in \
            CONFIG_IP6_NF_IPTABLES \
            CONFIG_IP6_NF_IPTABLES_LEGACY \
            CONFIG_NF_TABLES
          do
            if grep -qxF "${option}=y" "${KERNEL_CONFIG}"; then
              echo "INFO: ${option}=y"
            elif grep -qxF "${option}=m" "${KERNEL_CONFIG}"; then
              echo "INFO: ${option}=m"
            else
              echo "INFO: ${option} is not explicitly enabled"
            fi
          done

      - name: Build kernel module packages
        shell: bash
        run: |
          set -euo pipefail

          make package/kernel/linux/compile \
            -j"${MAKE_JOBS}" \
            V=sc 2>&1 | tee kernel-build.log

      - name: Build ip6tables userspace package
        shell: bash
        run: |
          set -euo pipefail

          make package/network/utils/iptables/compile \
            -j"${MAKE_JOBS}" \
            V=sc 2>&1 | tee ip6tables-build.log

      - name: Verify generated packages
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_DIR="bin/targets/${TARGET}/${SUBTARGET}/packages"

          echo "=== Target package directory ==="
          ls -lah "${PACKAGE_DIR}" 2>/dev/null || true

          echo "=== All generated packages ==="
          find bin \
            -type f \
            \( -name '*.ipk' -o -name '*.apk' \) \
            -print \
            2>/dev/null \
            | sort || true

          echo "=== Relevant build log messages ==="
          grep -RInE \
            'kmod-ip6tables|kmod-nf-ipt6|ip6tables-nft|not selected|built-in|not building|Collected errors|ERROR' \
            build_dir \
            tmp \
            2>/dev/null \
            | tail -n 200 \
            || true

          find_package() {
            local package_name="$1"

            find bin \
              -type f \
              \( \
                -name "${package_name}_*.ipk" \
                -o -name "${package_name}-*.apk" \
                -o -name "${package_name}_*.apk" \
              \) \
              -print -quit \
              2>/dev/null \
              || true
          }

          KMOD_IP6TABLES="$(find_package kmod-ip6tables)"
          KMOD_NF_IPT6="$(find_package kmod-nf-ipt6)"
          IP6TABLES_NFT="$(find_package ip6tables-nft)"

          echo "kmod-ip6tables: ${KMOD_IP6TABLES:-NOT_FOUND}"
          echo "kmod-nf-ipt6: ${KMOD_NF_IPT6:-NOT_FOUND}"
          echo "ip6tables-nft: ${IP6TABLES_NFT:-NOT_FOUND}"

          missing=0

          if [ -z "${KMOD_IP6TABLES}" ]; then
            echo "::warning::kmod-ip6tables was not generated"
            missing=1
          fi

          if [ -z "${KMOD_NF_IPT6}" ]; then
            echo "::warning::kmod-nf-ipt6 was not generated"
            missing=1
          fi

          if [ -z "${IP6TABLES_NFT}" ]; then
            echo "::warning::ip6tables-nft was not generated"
            missing=1
          fi

          if [ "${missing}" -ne 0 ]; then
            if [ "${STRICT_PACKAGES}" = "true" ]; then
              echo "ERROR: Required packages are missing"
              exit 1
            fi

            echo "Required package verification completed with warnings"
          else
            echo "All required packages were generated"
          fi

      - name: Collect result packages
        shell: bash
        run: |
          set -euo pipefail

          rm -rf result
          mkdir -p result

          find bin \
            -type f \
            \( -name '*.ipk' -o -name '*.apk' \) \
            -exec cp -v {} result/ \; \
            2>/dev/null \
            || true

          echo "=== Collected result packages ==="
          ls -lah result || true

      - name: Upload result packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fanchmwrt-kmods
          path: result/
          if-no-files-found: warn

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fanchmwrt-build-logs
          path: |
            download.log
            tools-build.log
            toolchain-build.log
            linux-prepare.log
            linux-compile.log
            kernel-build.log
            ip6tables-build.log
          if-no-files-found: ignore
