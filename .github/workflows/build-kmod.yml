name: Build FanchmWrt kmod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses5-dev \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-dev \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            swig \
            time \
            xsltproc \
            libxml-parser-perl \
            libelf-dev \
            device-tree-compiler

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Fix IPv6 iptables module for Linux 6.12
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("include/netfilter.mk")
          text = path.read_text()

          old = "CONFIG_IP6_NF_IPTABLES, $(P_V6)ip6_tables"
          new = "CONFIG_IP6_NF_IPTABLES_LEGACY, $(P_V6)ip6_tables"

          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
              print("Applied Linux 6.12 IPv6 iptables fix")
          elif new in text:
              print("Linux 6.12 IPv6 iptables fix already exists")
          else:
              print("Cannot find expected IPv6 iptables line")
              raise SystemExit(1)
          PY

          echo "Current IPv6 iptables configuration:"
          grep -n "IP6_NF_IPTABLES" include/netfilter.mk

      - name: Create configuration
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y

          CONFIG_PACKAGE_kmod-ip6tables=m
          CONFIG_PACKAGE_kmod-nf-ipt6=m
          CONFIG_PACKAGE_ip6tables-nft=m
          EOF

          make defconfig

      - name: Clean incomplete host tools
        run: |
          rm -rf staging_dir/host
          rm -rf build_dir/host
          rm -rf build_dir/hostpkg
          rm -rf tmp

      - name: Build OpenWrt host tools
        run: |
          make tools/install -j2 V=s

      - name: Build OpenWrt toolchain
        run: |
          make toolchain/install -j2 V=s

      - name: Check required host tools
        run: |
          test -x staging_dir/host/bin/openssl
          test -x staging_dir/host/bin/libdeflate-gzip

          echo "openssl:"
          ls -l staging_dir/host/bin/openssl

          echo "libdeflate-gzip:"
          ls -l staging_dir/host/bin/libdeflate-gzip

      - name: Build kernel modules
        shell: bash
        run: |
          set -o pipefail
          make -j1 package/kernel/linux/compile V=sc 2>&1 | tee kernel-build.log

      - name: Build ip6tables
        shell: bash
        run: |
          set -o pipefail
          make -j1 package/network/utils/iptables/compile V=sc 2>&1 | tee ip6tables-build.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            kernel-build.log
            ip6tables-build.log
          if-no-files-found: ignore

      - name: Collect packages
        run: |
          mkdir -p result

          find bin -type f \
            \( \
              -name '*kmod-ip6tables*.ipk' \
              -o -name '*kmod-nf-ipt6*.ipk' \
              -o -name '*ip6tables-nft*.ipk' \
            \) \
            -exec cp -v {} result/ \;

          echo "Generated files:"
          ls -lh result

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: fanchmwrt-ip6tables-kmods
          path: result/
          if-no-files-found: error
